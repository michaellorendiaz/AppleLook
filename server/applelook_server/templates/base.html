<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AppleLook</title>
<link rel="icon" href="static/icon.png">
<style>
  :root {
    --bg: #f5f5f7; --card: #fff; --text: #1d1d1f; --muted: #6e6e73; --line: #d2d2d7;
    --accent: #0071e3; --ok-bg: #e5f4e4; --ok: #1d6b2c; --err-bg: #fbebeb; --err: #b3261e;
    --info-bg: #e7f1fb; --info: #0b4f8a; --danger: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000; --card: #1c1c1e; --text: #f5f5f7; --muted: #98989d; --line: #38383a;
      --accent: #0a84ff; --ok-bg: #16301a; --ok: #7fd18b; --err-bg: #3a1614; --err: #ff8a80;
      --info-bg: #10263d; --info: #8cc4ff; --danger: #ff6b60;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  header img { width: 48px; height: 48px; }
  header h1 { font-size: 24px; margin: 0; }
  header .spacer { flex: 1; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
          padding: 16px 18px; margin-bottom: 16px; }
  .card h2 { font-size: 15px; margin: 0 0 10px; }
  label.field { display: block; margin: 10px 0 4px; font-weight: 500; }
  input[type=text], input[type=email], input[type=password], input[type=url], select {
    width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--bg); color: var(--text); font: inherit; }
  .check { display: flex; gap: 8px; align-items: flex-start; margin: 8px 0; }
  .check input { margin-top: 3px; }
  .hint { color: var(--muted); font-size: 13px; margin: 6px 0 0; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .row input[type=text] { flex: 1; min-width: 160px; }
  button { font: inherit; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line);
           background: var(--card); color: var(--text); cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.danger { color: var(--danger); }
  button.link { border: none; background: none; color: var(--accent); padding: 0; }
  .actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; margin: 4px 0 24px; }
  .flash { border-radius: 10px; padding: 10px 14px; margin-bottom: 12px; }
  .flash.ok { background: var(--ok-bg); color: var(--ok); }
  .flash.error { background: var(--err-bg); color: var(--err); }
  .flash.info { background: var(--info-bg); color: var(--info); }
  .status { display: flex; justify-content: space-between; gap: 12px; align-items: center; flex-wrap: wrap; }
  .status .big { font-size: 17px; font-weight: 600; }
  .muted { color: var(--muted); }
  ul.plain { margin: 8px 0 0; padding-left: 18px; }
  h3.sub { font-size: 14px; margin: 20px 0 0; padding-top: 14px; border-top: 1px solid var(--line); }
  details summary { cursor: pointer; font-weight: 600; }
  code { font-size: 13px; }
  footer { color: var(--muted); font-size: 12px; text-align: center; margin-top: 28px; }
  /* the same yellow capsule as the Mac app's settings window */
  .coffee { display: inline-flex; align-items: center; gap: 8px; margin-bottom: 10px;
            padding: 10px 24px; border-radius: 999px; background: #ffdd00; color: #000;
            font-size: 18px; font-weight: 600; text-decoration: none; }
  .coffee:hover { background: #ffe433; }
  .coffee svg { width: 22px; height: 22px; }
</style>
</head>
<body>
<main>
  <header>
    <img src="static/icon.png" alt="">
    <h1>AppleLook</h1>
    <span class="spacer"></span>
    {% if auth == "password" and session.get("in") %}
    <form method="post" action="logout"><input type="hidden" name="csrf" value="{{ csrf }}">
      <button class="link">Log out</button></form>
    {% endif %}
  </header>
  {% for category, message in get_flashed_messages(with_categories=true) %}
    <div class="flash {{ category }}">{{ message }}</div>
  {% endfor %}
  {% block body %}{% endblock %}
  <footer>
    <a class="coffee" href="https://buymeacoffee.com/michaellorendiaz" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 7h14v6a5 5 0 0 1-5 5H8a5 5 0 0 1-5-5V7Zm14 1h1.5a2.5 2.5 0 0 1 0 5H17v-1.6h1.5a.9.9 0 0 0 0-1.8H17V8ZM2 19.5h17a.5.5 0 0 1 0 1H2a.5.5 0 0 1 0-1ZM7 2.5c.6.6.6 1.4 0 2s-.6 1.4 0 2M10 2.5c.6.6.6 1.4 0 2s-.6 1.4 0 2M13 2.5c.6.6.6 1.4 0 2s-.6 1.4 0 2" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
      Buy me a coffee</a>
    <div>AppleLook Server {{ version }} · <a href="https://github.com/michaellorendiaz/AppleLook">GitHub</a></div>
  </footer>
</main>
</body>
</html>
