# AppleLook Server. Set your time zone below, then: docker compose up -d
# Open http://<this-machine>:8080 from your home network and choose a password.
# Don't forward this port from your router: the page holds your calendar link
# and iCloud password.
# Update: docker compose pull && docker compose up -d
services:
  applelook:
    image: ghcr.io/michaellorendiaz/applelook:latest
    container_name: applelook
    restart: unless-stopped
    ports:
      - "8080:8080"                       # change the left number if 8080 is taken
    environment:
      TZ: "America/New_York"              # your time zone, for times shown on the page
    volumes:
      - applelook-data:/data              # settings, iCloud password, login password

volumes:
  applelook-data:
